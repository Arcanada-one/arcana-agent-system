[workspace]
resolver = "2"
members = [
    "crates/cli",
    "crates/connectors",
    "crates/core",
    "crates/mcp",
    "crates/supervisor",
    "crates/tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Arcanada-one/arcana-agent-system"
authors = ["Arcanada <origin@veritasarcana.ai>"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
