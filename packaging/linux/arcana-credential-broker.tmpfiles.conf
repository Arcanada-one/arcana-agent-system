# Runtime and credential-source layout for the credential broker.
#
# Type d  = directory, D = directory (recreate on boot)
# Columns: type path mode user group age argument

# Private runtime directory. Group-traversable so the executor group can reach
# the socket, but not readable — the socket itself carries the access decision.
d /run/arcana-credential-broker 0750 arcana-broker arcana-executor - -

# Credential source directory: broker-only, no group or world access at all.
d /etc/arcana/credential-broker 0700 arcana-broker arcana-broker - -

# The credential file itself must be 0600 and broker-owned. The broker refuses
# to start otherwise, so this line is the installer's contract, not a courtesy.
z /etc/arcana/credential-broker/provider.key 0600 arcana-broker arcana-broker - -

# Broker state (generation counter, ledger). Never contains credential material.
d /var/lib/arcana-credential-broker 0700 arcana-broker arcana-broker - -
