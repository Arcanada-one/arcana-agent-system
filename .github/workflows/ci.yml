name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily, for `release-pending` below. That check must not ride on PR
    # traffic: a quiet repo is exactly where "bumped but never tagged" hides.
    - cron: '17 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt,clippy
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: the workspace can still be published
        # #101 was `cargo publish` failing outright on bare `path` dependencies.
        # Publishing nine interdependent crates is a one-way ratchet — a
        # crates.io version can be yanked but never reused — so the rehearsal
        # has to be real. `--workspace --dry-run` packages and verifies all nine
        # in dependency order against an in-memory index, which is the only way
        # to find out that the order works WITHOUT burning the version numbers.
        #
        # Nothing here publishes. This guards the option, which is otherwise
        # one careless manifest edit away from being lost again.
        run: cargo publish --workspace --dry-run
      - name: internal dependency versions and the publish cycle
        run: dev-tools/check-internal-versions.sh
      - name: SEC-0030 governance and platform control contracts
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats dev-tools/tests
          shellcheck -S warning \
            dev-tools/*.sh \
            packaging/tests/*.sh

  platform-isolation:
    name: platform-contract-mock / ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
          - platform: macos
            os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt,clippy
      - name: Common contract and platform identity probes
        run: cargo test --locked --workspace
      - name: Build live broker executable
        run: cargo build --locked --package arcana-credential-broker --bin arcana-credential-broker
      - name: Rehearse live install, failed upgrade, and binary-plus-config rollback
        run: bash packaging/tests/lifecycle-rehearsal.sh
      - name: Validate lifecycle shell
        run: bash -n packaging/broker-lifecycle.sh packaging/tests/lifecycle-rehearsal.sh

  security-audit:
    uses: Arcanada-one/datarim/.github/workflows/reusable-security-audit.yml@939a72870815b039c8a57df804259a13aa72c508
    with:
      stack: rust_cargo
      # Public pull-request code must not execute on a persistent self-hosted
      # runner. Use an ephemeral GitHub-hosted image.
      runner_labels: '["ubuntu-24.04"]'

  network-exposure-lint:
    uses: Arcanada-one/datarim/.github/workflows/network-exposure-lint.yml@939a72870815b039c8a57df804259a13aa72c508
    with:
      compose_paths: ''
      datarim_ref: '939a72870815b039c8a57df804259a13aa72c508'
      # Pinned to a hosted runner for the same reason security-audit above is: the
      # reusable workflow defaults to ["self-hosted","linux","ci-general"], and that
      # pool is oversubscribed. Jobs queued there expire after 24h and are
      # auto-cancelled, which surfaces as a FAILED rollup even though nothing ran —
      # blocking every PR on a required context that never executed. This job needs
      # no self-hosted resource: it checks out two repos, installs its own yq, and
      # runs a script.
      runner_labels: '["ubuntu-24.04"]'

  changelog:
    # A user-visible change is not finished at the commit: `release.yml` builds
    # its notes with `body_path` from CHANGELOG.md, so a missing entry is a
    # published release that does not mention a shipped behaviour change.
    #
    # This exists because intention failed three times in one session — #113,
    # #120 and #121 all merged touching user-facing source with no entry, and
    # the gap was only caught by hand while rebasing the release PR.
    #
    # Escape hatch: label the PR `no-changelog` for refactors, tests and
    # internal-only edits. Deliberate and visible in the PR, not silent.
    name: changelog
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: a user-facing source change needs a CHANGELOG line
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          case ",$LABELS," in
            *,no-changelog,*)
              echo "labelled no-changelog — skipping"; exit 0 ;;
          esac
          # Three dots: compare against the merge base, so commits that landed
          # on main after this branch was cut are not counted as its changes.
          changed=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          src=$(printf '%s\n' "$changed" | grep -E '^crates/[^/]+/src/.*\.rs$' || true)
          if [ -z "$src" ]; then
            echo "no user-facing source touched"; exit 0
          fi
          if printf '%s\n' "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated alongside:"; printf '  %s\n' "$src"; exit 0
          fi
          echo "::error::source under crates/*/src changed with no CHANGELOG.md entry."
          echo "Changed source:"; printf '  %s\n' "$src"
          echo
          echo "Add an entry under '## [Unreleased]', or label the PR 'no-changelog'"
          echo "if this change is genuinely invisible to users."
          exit 1

  release-pending:
    # The level above the `changelog` gate. That one catches a fix shipped
    # without a note; this one catches a whole RELEASE prepared and never cut —
    # version bumped in Cargo.toml, notes written, no tag, no GitHub release,
    # and `gh release list` still showing the previous version as Latest.
    #
    # Observed 2026-08-31: 0.2.0 merged to main with curated notes while v0.1.0
    # remained the only tag. Merged is not shipped.
    #
    # A grace period rather than an immediate failure, deliberately. Cutting a
    # tag legitimately lags the merge, so failing the instant the bump lands
    # would make this permanently red and teach everyone to ignore it. It fires
    # only once the gap has persisted long enough to be a forgotten release
    # rather than an in-flight one. (Until 2026-09-02 the lag was a code-owner
    # approval required by SEC0030; that human signature has since been removed
    # -- see docs/how-to/deployment.md.)
    name: release-pending
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: a bumped version must reach a tag
        env:
          # Was 3. Raised 2026-09-03 by operator decision: 0.2.0 is finished
          # and its notes are written, but publication is deliberately deferred
          # -- the agent is being substantially reworked (resolver, watcher,
          # architecture) off the back of the knowledge-contract work, and
          # nothing ships until that lands. The gate is not switched off: it
          # still fails main if a bumped version is forgotten, on a window that
          # matches the real horizon instead of an in-flight release. Put it
          # back to 3 when the release track resumes.
          GRACE_DAYS: '90'
        run: |
          set -euo pipefail
          version=$(grep -m1 -E '^version = "' Cargo.toml | cut -d'"' -f2)
          test -n "$version"
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            echo "v${version} is tagged"; exit 0
          fi
          # Anchoring is subtle (see the script): the root manifest now holds
          # nine copies of this version string, only one of which is the
          # package version, so a bare `-S` pickaxe on it can be reset by an
          # unrelated `[workspace.dependencies]` edit.
          bumped=$(dev-tools/release-bump-anchor.sh .)
          test -n "$bumped"
          age_days=$(( ( $(date +%s) - bumped ) / 86400 ))
          echo "workspace version ${version}; no v${version} tag; bumped ${age_days}d ago"
          if [ "$age_days" -lt "$GRACE_DAYS" ]; then
            echo "within the ${GRACE_DAYS}-day grace period — release presumed in flight"
            exit 0
          fi
          echo "::error::version ${version} was bumped ${age_days} days ago and has no v${version} tag."
          echo "The code and the notes are on main; nothing is published, so"
          echo "'gh release list' still shows the previous version as Latest."
          echo "Cut the release, or revert the bump if it is not going out."
          exit 1

  platform-native-negative-controls:
    name: platform-native-negative-controls / macos-xpc-sandbox
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prove XPC message identity and inherited App Sandbox denials
        run: bash packaging/tests/macos-live-xpc-sandbox.sh
      - name: Confirm exact launchd test resource cleanup
        if: always()
        run: |
          if launchctl print "gui/$(id -u)" 2>/dev/null | grep -Fq one.arcanada.sec0030.; then
            printf '%s\n' 'stale SEC-0030 launchd resource' >&2
            exit 1
          fi
          if launchctl print "user/$(id -u)" 2>/dev/null | grep -Fq one.arcanada.sec0030.; then
            printf '%s\n' 'stale SEC-0030 launchd resource' >&2
            exit 1
          fi
