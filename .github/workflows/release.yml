name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Protected tag preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full tagged history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the released commit on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Require successful protected checks for the exact tagged SHA
        shell: bash
        env:
          # Dedicated, repository-only fine-grained token from an
          # organization-managed machine account, expiring within 90 days.
          # Permissions: Administration write; Actions, Checks, Contents, and
          # Pull requests read. GitHub hides ruleset bypass actors from tokens
          # lacking Administration write; this workflow performs GET requests only.
          GH_TOKEN: ${{ secrets.SEC0030_GOVERNANCE_TOKEN }}
          EXPECTED_REVIEWER: ${{ vars.SEC0030_RELEASE_REVIEWER }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$EXPECTED_REVIEWER"
          protection=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection")
          jq -e '
            .required_status_checks.strict == true and
            ([.required_status_checks.checks[].context] | sort) == ([
              "lint-test",
              "network-exposure-lint / network-exposure-lint",
              "platform-contract-mock / linux",
              "platform-contract-mock / macos",
              "security-audit / security-audit (rust_cargo)"
            ] | sort) and
            all(.required_status_checks.checks[]; .app_id == 15368) and
            .required_pull_request_reviews.dismiss_stale_reviews == true and
            .required_pull_request_reviews.require_code_owner_reviews == true and
            .required_pull_request_reviews.require_last_push_approval == true and
            .required_pull_request_reviews.required_approving_review_count == 1 and
            ((.required_pull_request_reviews.bypass_pull_request_allowances.users // []) | length) == 0 and
            ((.required_pull_request_reviews.bypass_pull_request_allowances.teams // []) | length) == 0 and
            ((.required_pull_request_reviews.bypass_pull_request_allowances.apps // []) | length) == 0 and
            .enforce_admins.enabled == true and
            .required_linear_history.enabled == true and
            .allow_force_pushes.enabled == false and
            .allow_deletions.enabled == false and
            .restrictions == null
          ' <<<"$protection" >/dev/null
          checks=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100")
          while IFS=$'\t' read -r name app_id; do
            jq -e --arg name "$name" --arg sha "$GITHUB_SHA" --argjson app_id "$app_id" \
              '.check_runs | any(
                .name == $name and
                .head_sha == $sha and
                .app.id == $app_id and
                .status == "completed" and
                .conclusion == "success"
              )' \
              <<<"$checks" >/dev/null
          done < <(jq -r '.required_status_checks.checks[] | [.context, (.app_id | tostring)] | @tsv' <<<"$protection")
          pull_requests=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          jq -e --arg sha "$GITHUB_SHA" '
            [.[] | select(
              .state == "closed" and
              .merged_at != null and
              .base.ref == "main" and
              .merge_commit_sha == $sha
            )] | length == 1
          ' <<<"$pull_requests" >/dev/null
          pull_number=$(jq -r --arg sha "$GITHUB_SHA" '.[] | select(.state == "closed" and .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | .number' <<<"$pull_requests")
          pull_head=$(jq -r --arg sha "$GITHUB_SHA" '.[] | select(.state == "closed" and .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | .head.sha' <<<"$pull_requests")
          reviews=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}/reviews?per_page=100")
          jq -e --arg reviewer "$EXPECTED_REVIEWER" --arg head "$pull_head" '
            any(.[];
              .user.login == $reviewer and
              .state == "APPROVED" and
              .commit_id == $head
            )
          ' <<<"$reviews" >/dev/null
          grep -Eq "(^|[[:space:]])@${EXPECTED_REVIEWER}([[:space:]]|$)" .github/CODEOWNERS
      - name: Read back active no-bypass version-tag protection
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SEC0030_GOVERNANCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          ruleset_id=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            --jq '.[] | select(.name == "Protect version tags" and .enforcement == "active") | .id' | head -n 1)
          test -n "$ruleset_id"
          ruleset=$(gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}")
          jq -e '
            .target == "tag" and
            (.bypass_actors | type) == "array" and
            (.bypass_actors | length) == 0 and
            .conditions.ref_name.include == ["refs/tags/v*"] and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | index("deletion")) != null and
            ([.rules[].type] | index("update")) != null and
            ([.rules[].type] | index("non_fast_forward")) != null and
            ([.rules[].type] | index("required_signatures")) != null
          ' <<<"$ruleset" >/dev/null

  build:
    name: Build / ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_dir: linux
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            package_dir: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build compatible runtime and broker binaries
        run: |
          cargo test --locked --workspace
          cargo build --locked --release --package arcana-agent-system --bin arcana --target "$TARGET"
          cargo build --locked --release --package arcana-credential-broker --bin arcana-credential-broker --target "$TARGET"

      - name: Generate pinned CycloneDX SBOMs
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path crates/cli/Cargo.toml --format json \
            --describe binaries --spec-version 1.5 --target "$TARGET" --target-in-filename
          cargo cyclonedx --manifest-path crates/credential-broker/Cargo.toml --format json \
            --describe binaries --spec-version 1.5 --target "$TARGET" --target-in-filename

      - name: Prepare platform package, SBOMs, and hashes
        shell: bash
        run: |
          set -euo pipefail
          name="arcana-${GITHUB_REF_NAME}-${PLATFORM}"
          stage="dist/${name}"
          mkdir -p "$stage/bin" "$stage/packaging"
          install -m 0755 "target/${TARGET}/release/arcana" "$stage/bin/arcana"
          install -m 0755 "target/${TARGET}/release/arcana-credential-broker" \
            "$stage/bin/arcana-credential-broker"
          install -m 0755 packaging/broker-lifecycle.sh "$stage/packaging/broker-lifecycle.sh"
          cp -R "packaging/${{ matrix.package_dir }}" "$stage/packaging/"
          cp -R packaging/policy "$stage/packaging/"
          for sbom in crates/cli/*_"${TARGET}".cdx.json crates/credential-broker/*_"${TARGET}".cdx.json; do
            [ -f "$sbom" ] || { printf 'missing SBOM: %s\n' "$sbom" >&2; exit 1; }
            install -m 0644 "$sbom" "dist/${name}-$(basename "$sbom")"
          done
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          rm -rf -- "$stage"
          for artifact in dist/*.tar.gz dist/*.cdx.json; do
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256")
            else
              (cd dist && shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256")
            fi
          done

      - name: Upload unsigned platform payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  sign-attest-release:
    name: Sign, attest, and stage release
    needs: build
    runs-on: ubuntu-24.04
    environment: sec0030-protected-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Read back protected release-environment reviewers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SEC0030_GOVERNANCE_TOKEN }}
          EXPECTED_REVIEWER: ${{ vars.SEC0030_RELEASE_REVIEWER }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$EXPECTED_REVIEWER"
          reviewer_id=$(gh api "users/${EXPECTED_REVIEWER}" --jq '.id')
          environment=$(gh api "repos/${GITHUB_REPOSITORY}/environments/sec0030-protected-release")
          jq -e --arg login "$EXPECTED_REVIEWER" --argjson reviewer_id "$reviewer_id" '
            .protection_rules[] |
            select(.type == "required_reviewers") |
            .prevent_self_review == true and
            (.reviewers | any(
              .reviewer.id == $reviewer_id and
              .reviewer.login == $login
            ))
          ' <<<"$environment" >/dev/null
          gh api \
            "repos/${GITHUB_REPOSITORY}/environments/sec0030-protected-release/deployment-branch-policies" \
            --jq 'any(.branch_policies[]; .name == "v*" and .type == "tag")' | grep -qx true
      - name: Download exact platform payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify every binary package and SBOM
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.cdx.json' -o -name '*.sha256' \) -print0 |
            while IFS= read -r -d '' artifact; do
              cosign sign-blob --yes --bundle "${artifact}.cosign.bundle" "$artifact"
              cosign verify-blob \
                --bundle "${artifact}.cosign.bundle" \
                --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$artifact"
            done

      - name: Attest build provenance for packages and SBOMs
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*
