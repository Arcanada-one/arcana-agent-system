name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-sign-attest:
    name: Build, sign, and stage release
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build release binary
        run: cargo build --locked --release --package arcana-agent-system --bin arcana --target "$TARGET"

      - name: Prepare release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          asset="arcana-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p dist
          install -m 0755 "target/${TARGET}/release/arcana" "dist/${asset}"
          (
            cd dist
            sha256sum "${asset}" > "${asset}.sha256"
          )
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign binary with GitHub OIDC
        env:
          ASSET: ${{ steps.assets.outputs.asset }}
        run: |
          cosign sign-blob --yes \
            --bundle "dist/${ASSET}.cosign.bundle" \
            "dist/${ASSET}"
          jq -er '.messageSignature.signature' \
            "dist/${ASSET}.cosign.bundle" > "dist/${ASSET}.sig"

      - name: Verify keyless signature round-trip
        env:
          ASSET: ${{ steps.assets.outputs.asset }}
        run: |
          cosign verify-blob \
            --bundle "dist/${ASSET}.cosign.bundle" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "dist/${ASSET}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/${{ steps.assets.outputs.asset }}

      - name: Stage draft GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/${{ steps.assets.outputs.asset }}
            dist/${{ steps.assets.outputs.asset }}.sha256
            dist/${{ steps.assets.outputs.asset }}.sig
            dist/${{ steps.assets.outputs.asset }}.cosign.bundle
