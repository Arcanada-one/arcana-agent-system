name: release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  checks: read
  contents: read
  issues: read
  pull-requests: read

jobs:
  preflight:
    name: Protected tag preflight
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full tagged history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the released commit on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Require successful protected checks for the exact tagged SHA
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REVIEWER: ${{ vars.SEC0030_RELEASE_REVIEWER }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_REVIEWER"
          checks=$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            | jq '{check_runs: [.[].check_runs[]]}')
          while IFS= read -r name; do
            jq -e --arg name "$name" --arg sha "$GITHUB_SHA" '
              [.check_runs[] | select(
                .name == $name and .head_sha == $sha and .app.id == 15368
              )] |
              sort_by(.id) |
              length > 0 and
              last.status == "completed" and
              last.conclusion == "success"
            ' <<<"$checks" >/dev/null
          done < <(jq -nr '[
              "lint-test",
              "network-exposure-lint / network-exposure-lint",
              "platform-native-negative-controls / macos-xpc-sandbox",
              "platform-contract-mock / linux",
              "platform-contract-mock / macos",
              "security-audit / security-audit (rust_cargo)"
            ][]')
          pull_requests=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          jq -e --arg sha "$GITHUB_SHA" '
            [.[] | select(
              .state == "closed" and
              .merged_at != null and
              .base.ref == "main" and
              .merge_commit_sha == $sha
            )] | length == 1
          ' <<<"$pull_requests" >/dev/null
          pull_number=$(jq -r --arg sha "$GITHUB_SHA" '.[] | select(.state == "closed" and .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | .number' <<<"$pull_requests")
          pull_head=$(jq -r --arg sha "$GITHUB_SHA" '.[] | select(.state == "closed" and .merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha) | .head.sha' <<<"$pull_requests")
          reviews=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pull_number}/reviews?per_page=100")
          jq -e --arg reviewer "$EXPECTED_REVIEWER" --arg head "$pull_head" '
            any(.[];
              .user.login == $reviewer and
              .state == "APPROVED" and
              .commit_id == $head
            )
          ' <<<"$reviews" >/dev/null
          grep -Eq "(^|[[:space:]])@${EXPECTED_REVIEWER}([[:space:]]|$)" .github/CODEOWNERS
          repository_id=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.id')
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/issues/${pull_number}/comments?per_page=100" \
            | jq 'flatten' > "$RUNNER_TEMP/sec0030-governance-comments.json"
          bash dev-tools/sec0030-governance-witness-verify.sh \
            --comments "$RUNNER_TEMP/sec0030-governance-comments.json" \
            --public-key .github/sec0030-governance-witness.pub \
            --expected-author Arcanada \
            --repository "$GITHUB_REPOSITORY" \
            --repository-id "$repository_id" \
            --sha "$GITHUB_SHA" \
            --pull-number "$pull_number" \
            --pull-head-sha "$pull_head" \
            --reviewer "$EXPECTED_REVIEWER" \
            --now "$(date +%s)" \
            --key-not-before 1785628800 \
            --key-not-after 1793491199

  build:
    name: Build / ${{ matrix.platform }}
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_dir: linux
          - platform: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            package_dir: macos
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ env.TARGET }}

      - name: Build compatible runtime and broker binaries
        run: |
          cargo test --locked --workspace
          cargo build --locked --release --package arcana-agent-system --bin arcana --target "$TARGET"
          cargo build --locked --release --package arcana-credential-broker --bin arcana-credential-broker --target "$TARGET"

      - name: Generate pinned CycloneDX SBOMs
        run: |
          cargo install cargo-cyclonedx --version 0.5.9 --locked
          cargo cyclonedx --manifest-path crates/cli/Cargo.toml --format json \
            --describe binaries --spec-version 1.5 --target "$TARGET" --target-in-filename
          cargo cyclonedx --manifest-path crates/credential-broker/Cargo.toml --format json \
            --describe binaries --spec-version 1.5 --target "$TARGET" --target-in-filename

      - name: Prepare platform package, SBOMs, and hashes
        shell: bash
        run: |
          set -euo pipefail
          name="arcana-${GITHUB_REF_NAME}-${PLATFORM}"
          stage="dist/${name}"
          mkdir -p "$stage/bin" "$stage/packaging"
          install -m 0755 "target/${TARGET}/release/arcana" "$stage/bin/arcana"
          install -m 0755 "target/${TARGET}/release/arcana-credential-broker" \
            "$stage/bin/arcana-credential-broker"
          install -m 0755 packaging/broker-lifecycle.sh "$stage/packaging/broker-lifecycle.sh"
          cp -R "packaging/${{ matrix.package_dir }}" "$stage/packaging/"
          cp -R packaging/policy "$stage/packaging/"
          for sbom in crates/cli/*_"${TARGET}".cdx.json crates/credential-broker/*_"${TARGET}".cdx.json; do
            [ -f "$sbom" ] || { printf 'missing SBOM: %s\n' "$sbom" >&2; exit 1; }
            install -m 0644 "$sbom" "dist/${name}-$(basename "$sbom")"
          done
          tar -C dist -czf "dist/${name}.tar.gz" "$name"
          rm -rf -- "$stage"
          for artifact in dist/*.tar.gz dist/*.cdx.json; do
            if command -v sha256sum >/dev/null 2>&1; then
              (cd dist && sha256sum "$(basename "$artifact")" > "$(basename "$artifact").sha256")
            else
              (cd dist && shasum -a 256 "$(basename "$artifact")" > "$(basename "$artifact").sha256")
            fi
          done

      - name: Upload unsigned platform payloads
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 2

  sign-attest-release:
    name: Sign, attest, and stage release
    needs: build
    runs-on: ubuntu-24.04
    environment: sec0030-protected-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact platform payloads
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify every binary package and SBOM
        shell: bash
        run: |
          set -euo pipefail
          find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.cdx.json' -o -name '*.sha256' \) -print0 |
            while IFS= read -r -d '' artifact; do
              cosign sign-blob --yes --bundle "${artifact}.cosign.bundle" "$artifact"
              cosign verify-blob \
                --bundle "${artifact}.cosign.bundle" \
                --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
                --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                "$artifact"
            done

      - name: Attest build provenance for packages and SBOMs
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json
            dist/*.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/*
