[package]
name = "arcana-credential-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Privilege-separated local credential broker: the sole holder of provider credentials."

# The library is protocol, policy, ledger and audit only. It contains no
# secret-loading code: that lives exclusively in the binary, so nothing that
# links the library can acquire provider authority.
[lib]
name = "arcana_credential_broker"
path = "src/lib.rs"

[[bin]]
name = "arcana-credential-broker"
path = "src/bin/arcana-credential-broker.rs"

[dependencies]
arcana-execution-boundary = { workspace = true }
listenfd = "1"
nix = { version = "0.31", default-features = false, features = ["user"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rustix = { version = "1", features = ["fs", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
secrecy = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "1.1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
