[package]
name = "arcana-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Interactive CLI agent for the Arcanada service mesh"

[lib]
name = "arcana_cli"
path = "src/lib.rs"

[[bin]]
name = "arcana"
path = "src/main.rs"

[dependencies]
arcana-connectors = { workspace = true }
arcana-core = { workspace = true }
arcana-mcp = { workspace = true }
arcana-tools = { workspace = true }
async-trait = "0.1"
clap = { version = "4.5", features = ["derive", "cargo"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
serde = { version = "1", features = ["derive"] }
rustyline = "18"
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "signal", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false }
xdg = "3.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
secrecy = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "rt-multi-thread", "time", "test-util"] }
url = "2"
wiremock = "0.6"

[lints]
workspace = true
