[package]
name = "arcana-connectors"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Ecosystem connectors: HTTP bridges to Arcanada services (Model Connector, …) and the coworker subprocess wrapper"

[dependencies]
arcana-core = { path = "../core" }
arcana-execution-boundary = { path = "../execution-boundary" }
# The skills-store fetch seam (`FetchConn`) lives in `arcana-skills`; this crate
# provides the live adapter (`impl FetchConn for ScrutatorClient`). The edge is
# one-directional — `arcana-skills` never depends on `arcana-connectors` — so
# there is no cycle.
arcana-skills = { path = "../skills" }
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "process"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
url = "2"

[dev-dependencies]
blake3 = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[lints]
workspace = true
