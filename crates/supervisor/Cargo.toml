[package]
name = "arcana-supervisor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Process supervisor: process-group ownership, heartbeat/timeout watchdog, restart/escalation, budgets"

[dependencies]
arcana-core = { path = "../core" }
arcana-execution-boundary = { path = "../execution-boundary" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "process",
    "rt",
    "rt-multi-thread",
    "time",
    "sync",
    "io-util",
    "macros",
] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "process",
    "io-util",
    "sync",
] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.31", default-features = false, features = ["signal", "process"] }

[lints]
workspace = true
