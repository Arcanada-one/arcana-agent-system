[package]
name = "arcana-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Built-in tools: Read, Write, Edit, Grep, Bash, WebFetch, ArcanaSearch"

[dependencies]
arcana-connectors = { workspace = true }
arcana-core = { workspace = true }
arcana-execution-boundary = { workspace = true }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "process", "time", "io-util", "macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", default-features = false }
tracing = "0.1"
regex = "1.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots"] }
jsonschema = "0.30"
url = "2"

[dev-dependencies]
secrecy = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
wiremock = "0.6"
tempfile = "3"

[lints]
workspace = true
