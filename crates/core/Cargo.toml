[package]
name = "arcana-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core library: agent loop, tool dispatcher, context management"

[dependencies]
async-trait = "0.1"
blake3 = "1"
jsonschema = { version = "0.30", default-features = false }
regex = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Real model-aware token counting for the KB size-guard (ARAS-0053). Vocabs are
# embedded via include_str! at build time — no runtime download, fully offline &
# deterministic. `async-openai` integration is opt-in and stays disabled here to
# keep the dependency tree lean.
tiktoken-rs = { version = "0.12", default-features = false }
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["sync"] }
tokio-util = { version = "0.7", default-features = false }
toml = "0.8"
tracing = "0.1"
tracing-appender = "0.2"
xdg = "2.5"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[lints]
workspace = true
